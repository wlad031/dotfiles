providers:
  - name: ChatGPT
    type: chatgpt
    auth_file: ~/.pi/agent/auth.json
    watch_interval: 1m
    widgets:
      - provider_meta
    windows:
      - scope: Default
        window: 1
        widgets:
          - scope
          - window
          - usage
          - reset
          - pace_summary
          - pace_usage
          - pace_time
          - status_badge
          # - projected_empty
          # - projected_reset
          # - last_delta
          # - delta_today
          # - delta_24h
          # - peak_burn
          - history
          # - samples

