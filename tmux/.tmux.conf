# -----------------------------------------------------------------------------
# Post-plugin Status Layout
# -----------------------------------------------------------------------------
# tmux-gruvbox paints the palette/window formats above; override the final layout
# so the status stays at the bottom with two gruvbox/powerline-styled rows:
#   0: windows + date/time
#   1: sessions
set -g status 2
set -g status-position bottom
set -g status-justify left
set -g status-left ''
set -g status-left-length 0
set -g status-right-length 80
set -g status-right '#[bg=#3c3836,fg=#504945,nobold,nounderscore,noitalics]#[bg=#504945,fg=#a89984] 󰃭 %Y-%m-%d  󰥔 %H:%M '
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-format[1] "#[bg=#3c3836]#[fg=#ebdbb2]#(#{q:#{s|/[^/]*$||:#{config_files}}/status-sessions} #{q:client_session})#[align=right]#{?client_prefix,#[bg=#fb4934]#[fg=#282828]#[bold] PREFIX #[bg=#3c3836],}#{?pane_synchronized,#[bg=#83a598]#[fg=#282828]#[bold] SYNC #[bg=#3c3836],}#{?pane_in_mode,#[bg=#b8bb26]#[fg=#282828]#[bold] COPY #[bg=#3c3836],}#[bg=#3c3836]#[fg=#504945]#[nobold]#[nounderscore]#[noitalics]#[bg=#504945]#[fg=#ebdbb2] 󰡱 #{pane_current_command} " 
bind-key -T root MouseDown1Status if -F '#{==:#{mouse_status_range},session}' 'switch-client -t =' 'select-window -t ='


# -----------------------------------------------------------------------------
# Vim / Neovim Pane Navigation
# -----------------------------------------------------------------------------
# https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"


# -----------------------------------------------------------------------------
# Resize Mode
# -----------------------------------------------------------------------------
bind-key C-s run-shell "tmux switch-client -T mode-resize"
bind-key -T mode-resize q switch-client -T root
bind-key -T mode-resize k run-shell "tmux resize-pane -U 2; tmux switch-client -T mode-resize"
bind-key -T mode-resize h run-shell "tmux resize-pane -L 2; tmux switch-client -T mode-resize"
bind-key -T mode-resize l run-shell "tmux resize-pane -R 2; tmux switch-client -T mode-resize"
bind-key -T mode-resize r select-layout even-vertical
bind-key -T mode-resize e select-layout even-horizontal


# -----------------------------------------------------------------------------
# Plugin Options: tmux.nvim
# -----------------------------------------------------------------------------
# resize
set -g @tmux-nvim-resize true
set -g @tmux-nvim-resize-step-x 1
set -g @tmux-nvim-resize-step-y 1
set -g @tmux-nvim-resize-keybinding-left 'M-h'
set -g @tmux-nvim-resize-keybinding-down 'M-j'
set -g @tmux-nvim-resize-keybinding-up 'M-k'
set -g @tmux-nvim-resize-keybinding-right 'M-l'


# -----------------------------------------------------------------------------
# Session Launcher
# -----------------------------------------------------------------------------
# bind-key "f" run-shell "sesh connect \"$(
# 	sesh list | fzf-tmux -p 55%,60% \
# 		--reverse --no-sort --border-label ' sesh ' --prompt '⚡  ' \
# )\""
# bind-key "f" run-shell "sesh_connect"
bind-key "f" display-popup -E -w 80% -h 70% -d "/" -T 'Sesh' "exec tv --config-file \"$HOME/.config/television/config.toml\" --cable-dir \"$HOME/.config/television/cable\" sesh"
bind-key "p" set-option -gqF @command_palette_target_pane "#{pane_id}" \; display-popup -E -w 48% -h 32% -d "#{pane_current_path}" -T ' Commands ' "exec \"$HOME/.config/sesh/command-palette\""


# -----------------------------------------------------------------------------
# Copy Mode Navigation
# -----------------------------------------------------------------------------
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


# -----------------------------------------------------------------------------
# Passthrough and Environment
# -----------------------------------------------------------------------------
set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment OPENCODE_REMOTE_URL
set -ga update-environment OPENCODEUI_REMOTE_URL
