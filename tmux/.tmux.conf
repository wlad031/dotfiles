# tmux configuration

# -----------------------------------------------------------------------------
# General / Reloading
# -----------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."


# -----------------------------------------------------------------------------
# Terminal, Input, and Compatibility
# -----------------------------------------------------------------------------
set -g mouse on

set -g default-terminal "screen-256color"

setw -g xterm-keys on
set -s escape-time 10                     # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on

set -q -g status-utf8 on                  # expect UTF-8 (tmux < 2.2)
setw -q -g utf8 on

set -g history-limit 50000                # boost history


# -----------------------------------------------------------------------------
# Windows, Panes, and Display Behavior
# -----------------------------------------------------------------------------
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 2      # redraw status line every N seconds

set -g monitor-activity on
set -g visual-activity off

set -g status-keys vi
set -g mode-keys vi

set -g extended-keys on


# -----------------------------------------------------------------------------
# Prefix and Core Key Bindings
# -----------------------------------------------------------------------------
set -gu prefix2
unbind C-a
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

unbind h
bind h split-window -v -c "#{pane_current_path}"
unbind v
bind v split-window -h -c "#{pane_current_path}"

bind-key x kill-pane
bind-key o rotate-window


# -----------------------------------------------------------------------------
# Session and Status Placement
# -----------------------------------------------------------------------------
set -g detach-on-destroy off  # don't exit from tmux when closing a session

set -g focus-events on

set-option -g status-position bottom
set -g pane-border-status top


# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
# set -g @plugin 'catppuccin/tmux'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'omerxx/tmux-floax'


# -----------------------------------------------------------------------------
# Theme: tmux-gruvbox
# -----------------------------------------------------------------------------
set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'
# tmux-gruvbox provides the palette/window segment styling; final layout is
# overridden after TPM so windows/date and sessions can live on separate lines.
set -g @tmux-gruvbox-left-status-a '#S'


